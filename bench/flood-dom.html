<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DOM terminal flood</title>
  <style>body { margin: 0; background: #1e1e1e; }</style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const { ipcRenderer } = require('electron');
    const fs = require('fs');
    const createTerminal = require('./dom-terminal');

    const CHUNK_SIZE = 64 * 1024;

    ipcRenderer.on('start', async (event, { payloadPath, repeat, backend }) => {
      try {
        const wrapper = await createTerminal(backend, {
          cols: 120, rows: 30, scrollback: 1000,
          container: document.getElementById('terminal')
        });
        const { term, writeChunk } = wrapper;
        wrapper.onContextLoss(() => ipcRenderer.send('bench-error', 'WebGL context lost'));

        // xterm.js fires onRender per drawn frame. ghostty-web declares the
        // event but never fires it (its canvas renderer paints inside its own
        // rAF loop) — count compositor ticks during the feed instead; its
        // renderer paints every dirty frame, so rAF ticks ≈ presented frames.
        let frames = 0;
        let counting = true;
        if (backend.syncWrite) {
          const tick = () => { if (!counting) return; frames++; requestAnimationFrame(tick); };
          requestAnimationFrame(tick);
        } else {
          term.onRender(() => frames++);
        }

        // ghostty-web's write() takes bytes directly; xterm.js takes strings
        // (same latin1 conversion its harness always used).
        const raw = fs.readFileSync(payloadPath);
        const data = backend.syncWrite ? raw : raw.toString('latin1');

        const t0 = performance.now();
        for (let r = 0; r < repeat; r++) {
          for (let off = 0; off < data.length; off += CHUNK_SIZE) {
            await writeChunk(data.slice(off, off + CHUNK_SIZE));
          }
        }
        const parseMs = performance.now() - t0;

        // Wait for the final frame to actually be presented: one rAF lets the
        // renderer draw pending damage, the second guarantees the previous
        // frame reached the compositor.
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
        const e2eMs = performance.now() - t0;
        counting = false;

        const totalBytes = data.length * repeat;
        ipcRenderer.send('done', {
          mode: repeat > 1 ? 'sustained' : 'burst',
          repeat,
          payloadBytes: totalBytes,
          parseMs,
          e2eMs,
          frames,
          throughputMBps: (totalBytes / (1024 * 1024)) / (e2eMs / 1000),
          cols: term.cols,
          rows: term.rows,
          scale: window.devicePixelRatio
        });
      } catch (err) {
        ipcRenderer.send('bench-error', err.message + '\n' + err.stack);
      }
    });

    // Signal ready only after the compositor has presented the initial page,
    // so benchmark timing doesn't include first-paint warm-up.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ipcRenderer.send('ready');
    }));
  </script>
</body>
</html>
