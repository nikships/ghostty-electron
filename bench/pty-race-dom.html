<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DOM terminal pty-bench</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #0d1117; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const { ipcRenderer } = require('electron');
    const createTerminal = require('./dom-terminal');

    let term;
    let syncWrite = false;
    let parsedBytes = 0;
    let lastAckSent = 0;
    let watchMarker = null;
    let lastScan = 0;

    // Scan on an interval (not just render/write events) so detection can't
    // stall when output stops.
    let scanIntervalMs = 50;
    let scanTimer = setInterval(() => { lastScan = 0; scanForMarker(); }, scanIntervalMs);

    // Residual ack flush: acks are quantized (ackEvery), so after a
    // burst drains, up to ackEvery-1 parsed bytes stay un-acked — with
    // proportional LOW watermarks that can strand the PTY paused
    // forever. Flush the exact count periodically.
    setInterval(() => {
      if (parsedBytes > lastAckSent) {
        lastAckSent = parsedBytes;
        ipcRenderer.send('x-acked', parsedBytes);
      }
    }, 100);

    let debugScans = 0;
    let watchDepth = 0; // 0 = viewport endsWith; >0 = last N buffer lines, includes
    // Bottom-pinned viewport base. xterm.js exposes it as baseY; ghostty-web's
    // compat shim reports baseY/viewportY as 0, but its buffer length includes
    // scrollback — length - rows is the same quantity in both libraries.
    const viewportBase = (buf) => Math.max(0, buf.length - term.rows);
    function scanForMarker() {
      if (!watchMarker || !term) return;
      const t = performance.now();
      if (t - lastScan < scanIntervalMs) return;
      lastScan = t;
      const buf = term.buffer.active;
      const base = viewportBase(buf);
      if (++debugScans % 40 === 0) {
        const tail = [];
        for (let i = Math.max(0, term.rows - 3); i < term.rows; i++) {
          const l = buf.getLine(base + i);
          tail.push(l ? l.translateToString(true) : '<null>');
        }
        ipcRenderer.send('x-debug', { base, length: buf.length, tail });
      }
      if (watchDepth > 0) {
        // Deep scan for the latency probe: under a flood the echo scrolls out
        // of the viewport within milliseconds — look at recent history too.
        const total = buf.length;
        for (let i = Math.max(0, total - watchDepth); i < total; i++) {
          const line = buf.getLine(i);
          if (line && line.translateToString(true).includes(watchMarker)) {
            const marker = watchMarker;
            watchMarker = null;
            let sent = false;
            const report = () => { if (!sent) { sent = true; ipcRenderer.send('x-found', marker); } };
            requestAnimationFrame(() => requestAnimationFrame(report));
            setTimeout(report, 100);
            return;
          }
        }
        return;
      }
      for (let i = 0; i < term.rows; i++) {
        const line = buf.getLine(base + i);
        if (line && line.translateToString(true).trim().endsWith(watchMarker)) {
          const marker = watchMarker;
          watchMarker = null;
          // Report once the frame containing the marker was presented: two
          // rAFs, but raced against a timeout so a throttled/occluded
          // compositor can only delay the report, never hang it.
          let sent = false;
          const report = () => { if (!sent) { sent = true; ipcRenderer.send('x-found', marker); } };
          requestAnimationFrame(() => requestAnimationFrame(report));
          setTimeout(report, 100);
          return;
        }
      }
    }

    let ackEvery = 5000;
    ipcRenderer.on('x-config', async (event, { cols, rows, fontSize, backend, ackEvery: ae }) => {
      if (ae) ackEvery = ae;
      try {
        const wrapper = await createTerminal(backend, {
          cols, rows, fontSize, scrollback: 10000,
          container: document.getElementById('terminal')
        });
        term = wrapper.term;
        syncWrite = backend.syncWrite;
        term.onData((d) => ipcRenderer.send('x-input', d));
        term.onRender(scanForMarker);
        term.focus();
        ipcRenderer.send('x-term-up');
      } catch (err) {
        ipcRenderer.send('x-term-error', err.message + '\n' + err.stack);
      }
    });

    ipcRenderer.on('x-data', (event, d) => {
      if (syncWrite) {
        // ghostty-web parses synchronously; its write callback is rAF-deferred
        // (frame cadence, not parse completion) — ack as soon as write
        // returns, which is when the bytes actually are parsed.
        term.write(d);
        parsedBytes += d.length;
        if (parsedBytes - lastAckSent > ackEvery) {
          lastAckSent = parsedBytes;
          ipcRenderer.send('x-acked', parsedBytes);
        }
        scanForMarker();
        return;
      }
      term.write(d, () => {
        parsedBytes += d.length;
        // Flow control ack (VS Code-style): tell main how much we've parsed.
        if (parsedBytes - lastAckSent > ackEvery) {
          lastAckSent = parsedBytes;
          ipcRenderer.send('x-acked', parsedBytes);
        }
        scanForMarker();
      });
    });

    ipcRenderer.on('x-watch', (event, { marker, pollMs, depth }) => {
      watchMarker = marker;
      watchDepth = depth || 0;
      lastScan = 0;
      if (pollMs && pollMs !== scanIntervalMs) {
        scanIntervalMs = pollMs;
        clearInterval(scanTimer);
        scanTimer = setInterval(() => { lastScan = 0; scanForMarker(); }, scanIntervalMs);
      }
    });

    ipcRenderer.send('x-ready');
  </script>
</body>
</html>
