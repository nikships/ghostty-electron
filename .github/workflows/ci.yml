name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (full suite + benchmarks)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: npm ci

      - name: Build libghostty-vt
        run: npm run setup:ghostty

      - name: Build native addon
        run: npm run build:native

      - name: Generate payload
        run: npm run payload

      - name: Unit + conformance + fuzz tests
        run: npm test

      - name: Parse benchmark (10 MiB)
        run: npm run bench:parse -- --mb 10 --runs 3

      - name: Integration tests (Electron apps, PTY race, demo smoke)
        run: npm run test:integration

      - name: In-terminal benchmark (burst + sustained)
        run: node bench.js --runs 3

      - name: PTY race benchmark (64 MiB)
        run: npx electron pty-bench/main.js --mb 64 --interrupt-ms 2000

      - name: Compare with previous main run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact="results-$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          prev=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$prev" ]; then
            gh run download "$prev" -n "$artifact" -D previous-results || true
          fi
          node scripts/compare-results.js previous-results >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: always()
        run: node scripts/ci-summary.js >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-macos
          path: results/
          if-no-files-found: ignore

  linux:
    name: Linux (parser + xterm baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: npm ci

      - name: Build libghostty-vt
        run: npm run setup:ghostty

      - name: Build native addon (VT core + stub platform layer)
        run: npm run build:native

      - name: Generate payload
        run: npm run payload

      - name: Unit + conformance + fuzz tests (renderer tests skip)
        run: npm test

      - name: Parse benchmark (10 MiB)
        run: npm run bench:parse -- --mb 10 --runs 3

      - name: xterm baseline benchmark (Electron under xvfb)
        run: xvfb-run --auto-servernum npx electron xterm-bench/main.js --no-sandbox

      - name: Compare with previous main run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact="results-$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          prev=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$prev" ]; then
            gh run download "$prev" -n "$artifact" -D previous-results || true
          fi
          node scripts/compare-results.js previous-results >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: always()
        run: node scripts/ci-summary.js >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-linux
          path: results/
          if-no-files-found: ignore

  windows:
    name: Windows (full addon + benchmarks)
    # windows-latest now maps to Windows 2025 + VS2026 ("Visual Studio 18"),
    # which node-gyp ≤11.x cannot identify:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-VS2026-Readme.md
    # windows-2022 carries VS2022 which node-gyp handles fine. Revisit when
    # node-gyp learns VS2026.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: npm ci

      - name: Build libghostty-vt
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ghostty-org/ghostty vendor/ghostty
          cd vendor/ghostty
          # Explicit msvc ABI: zig's default gnu-ABI objects break link.exe's
          # default-CRT resolution (unresolved malloc/calloc everywhere).
          zig build -Demit-lib-vt=true -Doptimize=ReleaseFast -Dtarget=x86_64-windows-msvc
          # zig installs ghostty-vt.lib (DLL import lib) AND
          # ghostty-vt-static.lib (the static archive we link).
          ls -la zig-out/lib

      - name: Build native addon (VT core + D3D11/DirectWrite producer)
        run: npm run build:native

      - name: Inspect addon DLL dependencies (diagnostics)
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          & $dumpbin /DEPENDENTS native/build/Release/ghostty_producer.node

      - name: Generate payload
        run: npm run payload

      - name: Unit + conformance + fuzz tests (incl. D3D11 renderer)
        run: npm test

      - name: Parse benchmark (10 MiB)
        run: npm run bench:parse -- --mb 10 --runs 3

      - name: xterm baseline benchmark (Electron)
        run: npx electron xterm-bench/main.js

      # Experimental until proven on the GPU-less runner: sharedTexture
      # import of D3D11 NT handles under WARP inside Chromium's GPU process.
      - name: ghostty benchmark (Electron sharedTexture, experimental)
        continue-on-error: true
        run: npx electron ghostty-bench/main.js --screenshot

      - name: PTY race smoke (ConPTY + PowerShell, experimental)
        continue-on-error: true
        run: npx electron pty-bench/main.js --mb 8 --interrupt-ms 500

      - name: Compare with previous main run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact="results-$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          prev=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$prev" ]; then
            gh run download "$prev" -n "$artifact" -D previous-results || true
          fi
          node scripts/compare-results.js previous-results >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: always()
        shell: bash
        run: node scripts/ci-summary.js >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-windows
          path: results/
          if-no-files-found: ignore
