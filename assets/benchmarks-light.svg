<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="Benchmark comparison of xterm.js and libghostty in Electron">
<text x="24" y="24" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">xterm.js vs libghostty, both inside Electron</text>
<text x="24" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">macOS, Apple Silicon @2x — same payloads, same grid, presentation-confirmed finish lines</text>
